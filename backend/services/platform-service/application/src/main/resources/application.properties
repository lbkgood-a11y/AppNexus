# 平台应用系统配置。重要参数必须提供中文说明；本文件不保存任何明文凭据。
# 是否装配内嵌工作流引擎及工作流 API，默认 false；APP_WORKFLOW_ENGINE_ENABLED 可覆盖。仅受控表迁移与平台桥接就绪后启用；交付扫描由下项单独控制，引擎自身异步执行器仍关闭。
app.workflow.engine.enabled=${APP_WORKFLOW_ENGINE_ENABLED:false}
# 是否启用工作流可靠交付扫描，默认 false；APP_WORKFLOW_WORKER_ENABLED 覆盖，仅引擎启用且业务能力幂等就绪时生效。扫描1000毫秒、每轮最多20条，租约120秒、技术重试间隔30秒，超时转人工处理。
app.workflow.worker.enabled=${APP_WORKFLOW_WORKER_ENABLED:false}
# 后端 HTTP 监听端口，单位：端口号，默认 8080；须与前端开发代理及内部 OAuth 端点保持一致。
server.port=8080
# 浏览器访问授权服务器的公开基地址，默认 http://localhost:8848；生产通过 APP_PUBLIC_URL 指定 HTTPS 地址，不带末尾斜杠，变更回调地址须迁移数据库客户端注册。
app.public-url=${APP_PUBLIC_URL:http://localhost:8848}
# 登录成功或失败后返回的前端基地址，默认 http://localhost:8848；生产通过 APP_FRONTEND_URL 指定可信 HTTPS 地址，不带末尾斜杠。
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8848}
# BFF 机密客户端密钥，APP_BFF_SECRET 必填、无默认值；所有实例必须一致，变更须同步迁移数据库注册，禁止输出到日志。
app.bff-secret=${APP_BFF_SECRET}
# 是否禁止 JavaScript 读取会话 Cookie，默认 true；正式部署必须保持启用。
server.servlet.session.cookie.http-only=true
# 会话 Cookie 是否仅通过 HTTPS 发送，默认 true；仅 local 的本机 HTTP 调试配置允许关闭。
server.servlet.session.cookie.secure=true
# Cookie 的跨站发送策略，默认 lax；支持顶层授权跳转，不能替代 CSRF 校验。
server.servlet.session.cookie.same-site=lax
# Servlet 会话空闲超时，30m 表示 30 分钟；与下方 spring.session.timeout 保持一致，生产值须经风险和容量评估。
server.servlet.session.timeout=30m
# BFF 引用的身份提供方配置标识，固定为 appnexus，与 provider.appnexus 配置组对应。
spring.security.oauth2.client.registration.appnexus.provider=appnexus
# BFF 客户端标识，固定为 appnexus-bff；必须与数据库中持久化的 OAuth 客户端注册一致。
spring.security.oauth2.client.registration.appnexus.client-id=appnexus-bff
# BFF 换取 Token 时使用的机密凭据，复用 app.bff-secret；仅服务端持有，禁止传入前端配置。
spring.security.oauth2.client.registration.appnexus.client-secret=${app.bff-secret}
# OAuth 授权方式，固定为 authorization_code，并由安全配置强制使用 PKCE S256；不支持密码模式。
spring.security.oauth2.client.registration.appnexus.authorization-grant-type=authorization_code
# 授权码回调地址，由公开基地址拼接固定路径；必须与授权服务器登记的地址精确一致。
spring.security.oauth2.client.registration.appnexus.redirect-uri=${app.public-url}/login/oauth2/code/appnexus
# 申请的 OIDC scope，openid 用于身份认证，profile 用于基础资料；不代表业务权限。
spring.security.oauth2.client.registration.appnexus.scope=openid,profile
# 浏览器进入的标准授权端点，基于公开地址；生产必须可由用户浏览器访问。
spring.security.oauth2.client.provider.appnexus.authorization-uri=${app.public-url}/oauth2/authorize
# BFF 服务端换取 Token 的内部地址，当前指向本实例 HTTP 端口；仅用于内嵌授权服务器，拆分部署时须显式调整。
spring.security.oauth2.client.provider.appnexus.token-uri=http://localhost:${server.port}/oauth2/token
# BFF 校验签名 ID Token 时读取公钥的内部地址，当前指向本实例；只返回公钥，不返回私钥。
spring.security.oauth2.client.provider.appnexus.jwk-set-uri=http://localhost:${server.port}/oauth2/jwks
# BFF 读取 OIDC 用户信息的内部地址，当前指向本实例；Access Token 仅在服务端调用时使用。
spring.security.oauth2.client.provider.appnexus.user-info-uri=http://localhost:${server.port}/userinfo
# OIDC 不可变主体字段，固定为 sub，对应平台账号 UUID；不使用可变用户名作为主体标识。
spring.security.oauth2.client.provider.appnexus.user-name-attribute=sub

# MySQL JDBC 地址，APP_DATABASE_URL 必填；须包含 preserveInstants=true、connectionTimeZone=UTC、forceConnectionTimeZoneToSession=true 以统一时间语义。
spring.datasource.url=${APP_DATABASE_URL}
# 数据库应用账号，APP_DATABASE_USERNAME 必填、无默认值；使用最小必要权限，生产迁移账号与运行账号按部署策略分离。
spring.datasource.username=${APP_DATABASE_USERNAME}
# 数据库应用账号密码，APP_DATABASE_PASSWORD 必填、无默认值；从部署密钥存储注入，禁止提交或打印。
spring.datasource.password=${APP_DATABASE_PASSWORD}
# 是否禁止 Flyway clean，默认 true；防止清空数据库，生产环境不得关闭。
spring.flyway.clean-disabled=true
# 是否在应用启动时执行数据库迁移，APP_FLYWAY_ENABLED 默认 false；生产先由受控单一执行者迁移，local 配置显式开启。
spring.flyway.enabled=${APP_FLYWAY_ENABLED:false}
# Valkey 主机名，APP_VALKEY_HOST 默认 localhost；Spring Data Redis 客户端用于访问 Valkey，不表示改用 Redis 产品。
spring.data.redis.host=${APP_VALKEY_HOST:localhost}
# Valkey 服务端口，APP_VALKEY_PORT 默认 6379；本仓库 Compose 映射到宿主机 6380，由本地初始化脚本覆盖。
spring.data.redis.port=${APP_VALKEY_PORT:6379}
# Valkey 认证密码，APP_VALKEY_PASSWORD 必填、无默认值；所有应用实例须使用相同服务，禁止打印。
spring.data.redis.password=${APP_VALKEY_PASSWORD}
# 共享会话的键名前缀，默认 appnexus:session；同一应用的实例必须一致，不同环境应通过不同实例或独立前缀隔离。
spring.session.data.redis.namespace=appnexus:session
# Spring Session 共享会话空闲超时，30m 表示 30 分钟；与 Servlet 超时一致，不等同于绝对会话有效期。
spring.session.timeout=30m
# Web 认证绝对有效期，APP_SESSION_ABSOLUTE_TIMEOUT 默认 8h（8 小时）；必须大于零且不超过 24h，持续访问及租户切换不续期，各实例须一致；调整后对下一次请求生效。
app.session.absolute-timeout=${APP_SESSION_ABSOLUTE_TIMEOUT:8h}
# TOTP 密钥加密专用 AES-256 密钥，APP_MFA_ENCRYPTION_KEY 为 Base64 编码的 32 随机字节；默认空时关闭新绑定，已有 MFA 登录也拒绝放行。所有实例必须一致，生产从密钥存储注入；更换必须先受控重加密，禁止随重启生成或记录。
app.mfa.encryption-key=${APP_MFA_ENCRYPTION_KEY:}
# 平台管理员写入是否强制已绑定 MFA 且最近 5 分钟通过因子认证，APP_MFA_REQUIRE_PLATFORM 默认 true；false 仅用于受控迁移，关闭会降低安全基线，不影响本人绑定入口。
app.mfa.require-platform=${APP_MFA_REQUIRE_PLATFORM:true}
# 原生公开 OAuth 客户端固定 HTTPS App Link 回调，APP_NATIVE_REDIRECT_URI 默认空表示不创建客户端；启用时无密钥且强制 PKCE S256，首次注册后变更须迁移。Access Token 5 分钟，刷新族绝对 7 天，生产参数仍需容量/风险验收。
app.native.redirect-uri=${APP_NATIVE_REDIRECT_URI:}
# 技术日志等级字段附加平台生成的 traceId，默认无追踪上下文时为空；用于关联集成调用审计，不包含 Token、请求正文或客户端自报标识。
logging.pattern.level=%5p [traceId=%X{traceId:-}]
# 基础事件 Worker 默认启用；APP_EVENTS_WORKER_ENABLED=false 仅暂停领取，事件保留，权威同步撤权仍生效。
app.events.worker.enabled=${APP_EVENTS_WORKER_ENABLED:true}
# Worker 两轮之间等待毫秒数，APP_EVENTS_WORKER_DELAY 默认 5000；每轮最多 20 条，租约 30 秒、最多领取 5 次，生产须按任务时长和容量验收。
app.events.worker.delay=${APP_EVENTS_WORKER_DELAY:5000}
# 首次平台管理员账号名，APP_BOOTSTRAP_USERNAME 默认空；首次部署建议设置为 admin，必须与初始化密码成对配置，并同步授予一次性平台身份。
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
# 首次管理员密码，APP_BOOTSTRAP_PASSWORD 默认空；启用初始化时至少 12 个字符，只在首次原子初始化时写入，不用于覆盖或重置已有账号。
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
# 首个组织管理员所属租户 UUID，默认空（关闭）；与成员 UUID 成对配置，仅对已有有效租户执行一次，成功后移除配置。
app.organization.bootstrap.tenant-id=${APP_ORGANIZATION_BOOTSTRAP_TENANT_ID:}
# 首个组织管理员的现有租户成员 UUID（不是账号 UUID），默认空；授予该租户 GRANT 和 CRUD 并审计，不创建成员、不重置凭据、不恢复已撤销权限。
app.organization.bootstrap.member-id=${APP_ORGANIZATION_BOOTSTRAP_MEMBER_ID:}

# 持久 PKCS12 签名密钥库的文件路径，APP_SIGNING_KEY_STORE 必填；所有实例共享匹配的签名材料，禁止用临时密钥替代。
app.signing-key-store=${APP_SIGNING_KEY_STORE}
# PKCS12 密钥库及私钥口令，APP_SIGNING_KEY_PASSWORD 必填、无默认值；通过部署密钥存储注入，禁止打印。
app.signing-key-password=${APP_SIGNING_KEY_PASSWORD}
# 密钥库中的 RSA 私钥别名，APP_SIGNING_KEY_ALIAS 默认 appnexus；须同时存在对应证书，并用作公开密钥的 kid。
app.signing-key-alias=${APP_SIGNING_KEY_ALIAS:appnexus}

# 启用标准 ProblemDetail 错误响应，返回稳定业务码与受控说明，不暴露堆栈或请求凭据。
spring.mvc.problemdetails.enabled=true

# 使用带主体索引的共享会话仓储，支持仅按当前账号查询和撤销会话；禁止扫描全部会话键。
spring.session.data.redis.repository-type=indexed
