# 一期持续集成：每次提交与拉取请求运行后端真实容器、架构、前端类型/测试/构建。
name: verify
# 触发条件无环境密钥依赖；pull_request 不使用 pull_request_target 的高权限上下文。
on:
  push:
  pull_request:
# 工作流只读仓库，禁止测试任务修改代码或创建发布。
permissions:
  contents: read
# 相同分支的新提交取消旧验证，避免重复容器占用；不同分支互不取消。
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    # GitHub Linux 执行器提供 Docker，真实 MySQL/Valkey 由 Testcontainers 创建。
    runs-on: ubuntu-latest
    # 后端最长 30 分钟，超时视为失败，不跳过安全或迁移测试。
    timeout-minutes: 30
    steps:
      # 读取当前提交；后续 Maven 不需要写入 Git 权限。
      - uses: actions/checkout@v4
        with:
          # 保留 Git 基准以检查 PR 或前一次提交的契约，不能因浅克隆静默跳过兼容检查。
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          # 与仓库 Java 21 编译和运行基线保持一致。
          distribution: temurin
          java-version: '21'
          # 仅缓存 Maven 依赖，不缓存数据库或运行期凭据。
          cache: maven
      - name: Verify backend, architecture and PoCs
        env:
          # PR 使用目标分支提交，push 使用前次提交；首次全零 revision 表示首次基线。
          API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # container-tests 打开隔离 PoC 容器测试；正式应用集成测试始终执行。
        run: mvn -B -f backend/pom.xml -Pcontainer-tests verify
      - name: Retain test reports
        # 失败也保留测试诊断，不上传环境文件、密钥、Token 或本机日志目录。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/*.xml
          # 测试报告保留 7 天，超过期限由 GitHub 自动清理。
          retention-days: 7
  frontend:
    # 前端构建使用与本机已验证一致的 Node 24 主版本。
    runs-on: ubuntu-latest
    # 前端最长 15 分钟，安装和类型检查失败立即结束。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        # 与 frontend/package.json 的 packageManager 保持一致，不安装浮动最新版。
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        # 固定锁文件，CI 不允许自动改写依赖解析结果。
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check types
        working-directory: frontend
        run: pnpm typecheck
      - name: Run tests
        working-directory: frontend
        run: pnpm test
      - name: Build workspace
        working-directory: frontend
        run: pnpm build
