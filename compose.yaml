# 本地 Compose 项目名，作为容器、网络和数据卷的资源名前缀。
name: appnexus
services:
  mysql:
    # MySQL 8.4 LTS 开发镜像；生产部署应固定验证后的补丁版本或镜像摘要。
    image: mysql:8.4
    environment:
      # 首次创建的业务数据库名；已有数据卷不会因修改此值自动迁移。
      MYSQL_DATABASE: appnexus
      # 首次创建的应用数据库账号，须与后端 APP_DATABASE_USERNAME 一致。
      MYSQL_USER: appnexus
      # 数据库应用账号初始密码，APP_DATABASE_PASSWORD 必填、无默认值；不重置已有账号。
      MYSQL_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      # root 初始密码，APP_DATABASE_ROOT_PASSWORD 必填、无默认值；禁止用于应用运行。
      MYSQL_ROOT_PASSWORD: ${APP_DATABASE_ROOT_PASSWORD:?Set APP_DATABASE_ROOT_PASSWORD}
    ports:
      # 仅本机访问：宿主机 3307 → 容器 3306，后端本地 JDBC 使用宿主机端口。
      - "127.0.0.1:3307:3306"
    volumes:
      # 持久化数据库数据；重建容器保留，删除卷会丢失账号与授权记录。
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 健康检查仅确认数据库进程响应，不代表业务迁移已完成。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      # 健康检查间隔，5s 表示每 5 秒执行一次。
      interval: 5s
      # 健康检查单次超时，3s 表示最多等待 3 秒。
      timeout: 3s
      # 连续失败 30 次后标记为不健康；不代表业务请求的重试次数。
      retries: 30
  valkey:
    # Valkey 8 本地开发镜像，通过 Spring Data Redis/Lettuce 协议访问。
    image: valkey/valkey:8-alpine
    environment:
      # Valkey 密码，APP_VALKEY_PASSWORD 必填、无默认值；与后端使用的凭据一致。
      APP_VALKEY_PASSWORD: ${APP_VALKEY_PASSWORD:?Set APP_VALKEY_PASSWORD}
    # 启用 AOF 持久化和密码认证；$$ 将变量留给容器展开，配置文件不保存明文值。
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$APP_VALKEY_PASSWORD\""]
    ports:
      # 仅本机访问：宿主机 6380 → 容器 6379，后端本地连接使用 6380。
      - "127.0.0.1:6380:6379"
    volumes:
      # 保存 AOF 等持久数据；会话仍受有效期和撤销状态约束。
      - valkey-data:/data
volumes:
  # MySQL 命名数据卷；停止服务不删除数据，显式删除卷会清空数据。
  mysql-data:
  # Valkey 命名数据卷；用于重建容器后的数据恢复，不能替代备份。
  valkey-data:
